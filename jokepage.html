<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scrolling Hello World</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
    background-size: 800% 800%;
    animation: bgAnimation 20s ease infinite;
    font-family: 'Arial', sans-serif;
  }

  @keyframes bgAnimation {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .scrolling-text {
    font-size: 4em;
    font-weight: bold;
    white-space: nowrap;
    position: absolute;
    color: hsl(0, 100%, 50%);
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="scrolling-text">Hello World</div>
<div class="scrolling-text">YOU SHOULD CHECK OUT MY MOTOROLA M68XX EMULATOR</div>

<script>
  const texts = document.querySelectorAll('.scrolling-text');

  texts.forEach(text => {
    function randomize() {
      const direction = Math.random() > 0.5 ? 1 : -1;
      const speed = Math.random() * 0.5 + 0.5; // slower speed
      const top = Math.random() * (window.innerHeight - text.offsetHeight * 1.1); // respect edges
      const hue = Math.random() * 360;

      text.style.top = `${top}px`;
      text.style.color = `hsl(${hue}, 100%, 50%)`;

      let pos = direction === 1 ? -text.offsetWidth : window.innerWidth - 50; // start slightly inside
      function animate() {
        pos += direction * speed;
        text.style.left = `${pos}px`;

        if ((direction === 1 && pos > window.innerWidth - text.offsetWidth/4) || 
            (direction === -1 && pos < text.offsetWidth/4)) {
          pos = direction === 1 ? -text.offsetWidth : window.innerWidth - text.offsetWidth;
          text.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
          text.style.top = `${Math.random() * (window.innerHeight - text.offsetHeight * 1.1)}px`;
        }
        requestAnimationFrame(animate);
      }
      animate();
    }
    randomize();
  });
</script>
</body>
</html>
