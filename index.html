<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vladimir Januš</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .tagline {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        a {
            display: block;
            padding: 0.8rem 1.2rem;
            text-decoration: none;
            color: #e2e8f0;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.15s;
        }
        a:hover {
            background: rgba(255,255,255,0.14);
            transform: translateY(-2px);
        }
        a.play {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            font-weight: 600;
            font-size: 1.05rem;
        }
        a.play:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
        }
        a.builds {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            font-weight: 600;
            font-size: 1.05rem;
        }
        a.builds:hover {
            background: linear-gradient(135deg, #047857, #059669);
        }
        .builds-panel {
            display: none;
            margin-top: 1rem;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 1.2rem;
            text-align: left;
        }
        .builds-panel.open {
            display: block;
        }
        .builds-panel h3 {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 0.6rem;
        }
        .builds-panel .folder {
            margin-bottom: 0.5rem;
        }
        .builds-panel .folder-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        .builds-panel .dl-link {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .builds-panel .dl-link:hover {
            background: rgba(255,255,255,0.2);
            transform: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Vladimir Januš</h1>
        <p class="tagline">I make cool stuff.</p>
        <div class="links">
            <a class="play" href="ClientWeb/index.html">💣 Minesweeper Online Web</a>
            <a class="builds" href="#" id="buildsToggle" onclick="toggleBuilds(event)">📦 MinesweeperOnline Builds</a>
            <div class="builds-panel" id="buildsPanel">
                <h3>ClientQtBuilds</h3>
                <div class="folder">
                    <div class="folder-name">📁 Windows</div>
                    <a class="dl-link" href="ClientQtBuilds/Windows/MinesweeperOnline-7.2-Windows.zip" download>⬇ MinesweeperOnline-7.2-Windows.zip</a>
                </div>
            </div>
            <a href="https://github.com/VladimirJanus/Motorola-M68XX-Microprocessor-Emulator">Motorola M68XX Emulator</a>
            <a href="https://github.com/VladimirJanus">GitHub</a>
        </div>
    </div>
    <script>
        function toggleBuilds(e) {
            e.preventDefault();
            document.getElementById('buildsPanel').classList.toggle('open');
        }
    </script>
</body>
</html>
